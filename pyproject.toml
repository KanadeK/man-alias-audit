[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "man-alias-audit"
version = "0.1.0"
description = "Portable read-only graph audit of staged manpage aliases and compression targets"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "KanadeK"}]
dependencies = []

[project.scripts]
man-alias-audit = "man_alias_audit.cli:main"

[project.urls]
Repository = "https://github.com/KanadeK/man-alias-audit"
Issues = "https://github.com/KanadeK/man-alias-audit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
