name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install native comparison tool
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y man-db
          python -c "import shutil; from pathlib import Path; assert shutil.which('zsoelim') or any(Path(p).is_file() for p in ['/usr/libexec/man-db/zsoelim', '/usr/lib/man-db/zsoelim'])"
      - run: python -m pip install . -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: python -m build
      - run: python examples/make_demo.py demo-ci
      - run: man-alias-audit demo-ci --json
